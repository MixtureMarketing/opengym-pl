# Buduje frontend openGym i publikuje go na GitHub Pages.
# Efekt: aplikacja pod https://<user>.github.io/<repo>/ — otwierasz na telefonie
# i dodajesz do ekranu głównego (PWA). Dane trzymane lokalnie w przeglądarce
# (tryb gościa) — bez serwera nie ma logowania kluczem ani synchronizacji.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Testy
        run: npm test

      - name: Build (media z CDN, żeby nie pakować ~140 MB obrazków)
        env:
          VITE_IMG_BASE: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/
          VITE_GIF_BASE: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/
          # Hosting statyczny: nie ma serwera Node, więc aplikacja nie pokazuje logowania
          # kluczem dostępu. Bez tego POST do /api/... kończył się błędem 405 od GitHub Pages.
          VITE_STATIC: '1'
          # Ustaw te dwie wartości w Settings → Secrets and variables → Actions,
          # a aplikacja przełączy się na logowanie mailem i synchronizację przez Supabase.
          # Klucz `anon` jest jawny z założenia — dostępu pilnuje RLS w bazie.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: SPA fallback (404.html = index.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
