# Buduje obrazy Dockera (api + web) i wypycha je do GitHub Container Registry,
# żeby na serwerze wystarczyło `docker compose pull && docker compose up -d`.
# Obrazy lądują pod ghcr.io/<owner>/opengym-api i ghcr.io/<owner>/opengym-web.
name: Obrazy Dockera (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: web
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nazwa obrazu małymi literami
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/opengym-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
